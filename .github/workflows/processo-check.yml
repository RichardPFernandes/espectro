name: processo-check

# Barreira do Acordo de desenvolvimento v2 (seção 8): um rótulo de nível,
# seção Evidência preenchida e, no leve, sem SPEC/handoff/evidence separado e
# até 400 linhas, e aviso (sem reprovar) quando código de capacidade muda sem a spec dela.
# Confere também as ligações entre specs vivas, ADRs e SPECs.
# Limites em .github/processo.json.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: processo-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  processo-check:
    name: processo-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # O script, os limites e o template vêm da base do PR: um PR não afrouxa
      # a própria barreira. Os arquivos e o corpo do PR vêm da API.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /docs/capacidades/
            /scripts/capability-map.js
            /scripts/lib/front-matter.js
            /scripts/knowledge-links.js
            /scripts/lib/knowledge-links.js
      # Código e páginas do PR: os testes do check e do hook e as ligações entre specs e ADRs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: head
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /docs/capacidades/
            /docs/adr/
            /docs/historico/
            /tasks/
            /scripts/capability-map.js
            /scripts/knowledge-links.js
            /scripts/lib/front-matter.js
            /scripts/lib/knowledge-links.js
            /.claude/settings.json
            /.claude/hooks/
            /.claude/skills/
            /.claude/commands/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Testes do check e do hook (código do PR)
        working-directory: head
        run: node --test .github/scripts/*.test.mjs .claude/hooks/*.test.mjs
      - name: Conferir o PR (regras da base)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f base/.github/scripts/processo-check.mjs ]; then
            node base/.github/scripts/processo-check.mjs
          else
            # Só no PR que introduz o check: a base ainda não o tem.
            echo "::notice title=processo-check::a base ainda não tem o check; usando o do PR (bootstrap)"
            node head/.github/scripts/processo-check.mjs
          fi
      # Ligações entre specs vivas, ADRs e SPECs: o conferidor vem da base e as
      # páginas vêm do PR. Roda mesmo se o passo anterior falhar, para reportar os dois.
      - name: Ligações entre specs, ADRs e SPECs (regras da base)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # A base tem o conferidor desde a PR #235; sem ele, falha em vez de usar o do PR.
          if [ ! -f base/scripts/knowledge-links.js ]; then
            echo "::error title=knowledge-links::a base não tem scripts/knowledge-links.js; o PR não confere com o próprio script"
            exit 1
          fi
          cp base/scripts/knowledge-links.js head/scripts/knowledge-links.js
          cp base/scripts/lib/knowledge-links.js base/scripts/lib/front-matter.js head/scripts/lib/
          node head/scripts/knowledge-links.js --check
