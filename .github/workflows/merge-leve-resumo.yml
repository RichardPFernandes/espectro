name: merge-leve-resumo

# Resumo diário do merge automático do Leve (F0.8, PRI-410; SPEC item d, AC-03).
# Comenta na issue fixa "Merge automático do Leve: resumo" o que o bot mesclou
# desde o último resumo, os elegíveis não mesclados e os Leve que ficaram de
# fora, com o motivo. Dia vazio não comenta. Checkout só de /.github/ da main;
# nada do código dos PRs. A única escrita é a issue fixa e o comentário.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: merge-leve-resumo
  cancel-in-progress: false

jobs:
  resumo:
    name: merge-leve-resumo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      # Sem ref: o checkout é da main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Comentar o resumo do dia
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/merge-leve-resumo.mjs
