# Regra (D-RMP-01, item 7; PRI-406): patch e minor são mesclados com CI verde; major é fechado com nota.
# O merge e o fechamento são do Richard. Os grupos abaixo juntam patch e minor num PR só.
version: 2
updates:
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-patch-minor:
        update-types:
          - minor
          - patch
