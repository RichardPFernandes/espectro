    owner: UNKNOWN
  - path: scripts/src/index.ts
    capability: scripts-public-entrypoint
    owner: UNKNOWN

  # Esqueleto de camadas (PRI-104) — pastas ainda sem módulos
  - path: scripts/src/domain/
    capability: domain-layer
    owner: UNKNOWN
  - path: scripts/src/ports/
