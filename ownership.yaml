    owner: UNKNOWN
  - path: scripts/lib/acceptance-evidence.js
    capability: acceptance-evidence
    owner: UNKNOWN
  - path: scripts/lib/review-result.js
    capability: review-result
    owner: UNKNOWN

  # Aplicação / orquestração
  - path: scripts/readmine-watcher.js
    capability: watcher-orchestration
    owner: UNKNOWN
  - path: scripts/lib/cycle-replayer.js
    capability: cycle-replay
    owner: UNKNOWN
  - path: scripts/lib/dry-run.js
    capability: dry-run
    owner: UNKNOWN
  - path: scripts/lib/authorization.js
    capability: human-authorization
    owner: UNKNOWN

  # Integrações (adapters concretos atuais)
  - path: scripts/lib/bitbucket-pr.js
    capability: bitbucket-pr
    owner: UNKNOWN
  - path: scripts/lib/redmine-fetch.js
    capability: redmine-fetch
    owner: UNKNOWN
  - path: scripts/notify.js
    capability: notifier
    owner: UNKNOWN

  # Dashboard / projeção (APP-01 candidato)
  - path: dashboard/server.js
    capability: dashboard-http
    owner: UNKNOWN
  - path: dashboard/coordination.js
    capability: coordination-api
    owner: UNKNOWN

  # Fundação TS (PRI-103) — plataforma, sem owner de domínio
  - path: scripts/src/platform/roots.ts
    capability: platform-roots
    owner: UNKNOWN
  - path: scripts/src/index.ts
    capability: scripts-public-entrypoint
    owner: UNKNOWN

  # Esqueleto de camadas (PRI-104) — pastas ainda sem módulos
  - path: scripts/src/domain/
    capability: domain-layer
    owner: UNKNOWN
  - path: scripts/src/ports/
    capability: ports-layer
    owner: UNKNOWN
  - path: scripts/src/application/
    capability: application-layer
    owner: UNKNOWN
  - path: scripts/src/adapters/
    capability: adapters-layer
    owner: UNKNOWN
  - path: scripts/src/config/
    capability: config-layer
    owner: UNKNOWN
  - path: scripts/src/composition/
    capability: composition-layer
    owner: UNKNOWN
  - path: scripts/src/interface/
    capability: interface-layer
    owner: UNKNOWN
