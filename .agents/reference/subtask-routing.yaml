# Rito de nascença: subtarefa → skill → faixa (esteira Cursor / fila C).
# Preferência Project 2026-11-05. Não é policy Runtime / would_route / Attempt / S4.
# Paired with subtask-routing.md + skill-model-map.yaml.

version: "2026-11-05.1"
surface: esteira-cursor
authority_runtime: false
pairs_with:
  - skill-model-map.yaml
  - ../playbook/README.md

preferences:
  planning_bias: quality-up
  simple_task_model: sonnet
  opus_only: pesado
  break_parent_opus_on_leve: true

birth_checklist:
  - id: 1
    step: recortar_acao_playbook
  - id: 2
    step: carregar_skill
  - id: 3
    step: ler_faixa_skill_model_map
  - id: 4
    step: aplicar_vies_preferencias
  - id: 5
    step: quebrar_heranca_opus_se_leve
  - id: 6
    step: anotar_skill_faixa_no_brief

brief_annotation:
  required_fields: [skill, faixa]
  optional_fields: [modelo_sugerido]
  note: "Espelho humano do would_route na esteira — não grava Attempt."

agents_skills:
  primary_reference: "https://github.com/addyosmani/agent-skills"
  format_spec: "https://agentskills.io"
  role: patterns_for_breakdown_and_intent_to_skill
  adopt_patterns:
    - using-agent-skills  # intent → skill before faixa
    - planning-and-task-breakdown  # atomic subtarefa
    - orchestration-coordinator-as-orchestrator
    - incremental-implementation  # split leve vs médio/pesado
    - context-engineering
    - skill-anatomy-descriptions
  keep_prisma_skills: true  # do not replace .agents/skills/
  do_not_install_mass: true  # no npx skills add of all 25
  forbidden:
    - authority_runtime
    - would_route_official
    - s4_live_routing
    - replace_freeze_gates_with_constraint_skill
    - replace_prisma_tests_with_generic_tdd
    - model_router_persona

out_of_scope:
  - s4
  - pri-234
  - state_json_would_route
  - anti_recusa_pri_181
